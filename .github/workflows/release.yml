name: "Release"

on:
  push:
    branches: ["master"]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  # Needed because release.yml invokes ci.yml via workflow_call, and the test
  # job there requests checks: write (for dorny/test-reporter). Reusable
  # workflows can only downgrade caller permissions, never expand them — so
  # any permission the called job asks for must be granted here too, or the
  # called workflow fails at startup.
  checks: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Defence-in-depth: run the full CI suite before any publish/version-PR work.
  # Branch protection already requires CI green on the PR that merged here,
  # but a bypassed merge (admin override, ruleset disabled, etc.) would otherwise
  # let a broken state publish. This makes that impossible.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: "Version or publish"
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/procon-ip
    steps:
      # Mint an installation access token from the "release" GitHub App so the
      # commits and PR that changesets/action pushes are attributed to a bot
      # identity rather than the default GITHUB_TOKEN. GitHub's
      # no-recursive-workflows rule suppresses downstream CI for anything pushed
      # by GITHUB_TOKEN — App tokens (and PATs) are exempt, which is what makes
      # the bot-opened "Version Packages" PR auto-fire CI checks. The App's
      # Client ID and private key are stored as repo secrets.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24 (LTS) ships with npm 11.x. npm Trusted Publishing requires
          # npm CLI >= 11.5.1 for the OIDC handshake; Node 22 ships with npm 10
          # which falls back to a (then-empty) NODE_AUTH_TOKEN-based auth, the
          # registry treats the request as anonymous, and we get a misleading
          # 404 on PUT. See npm/cli#9088 for the surfaced-diagnostics request.
          # CI matrix can stay on 20+22 -- this only matters for the publish step.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          version-script: pnpm version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # changesets/action v2 no longer reads the token from the GITHUB_TOKEN
          # env var — it must be passed as the github-token input. Reusing the
          # App installation token here is what pushes the release commit/tag,
          # opens the bot-authored "Version Packages" PR (so downstream CI
          # fires), and creates the GitHub release.
          #
          # Why v2: v1 is only compatible with @changesets/cli v1/v2. Once the
          # CLI was bumped to v3, v1 could no longer parse the publish output,
          # so it published to npm but silently skipped the git tag and the
          # GitHub release (e.g. v2.1.2). v2 adds @changesets/cli v3 support and
          # pushes tags/releases via the GitHub API by default.
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
