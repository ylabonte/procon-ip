name: "Release"

on:
  push:
    branches: ["master"]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  # Needed because release.yml invokes ci.yml via workflow_call, and the test
  # job there requests checks: write (for dorny/test-reporter). Reusable
  # workflows can only downgrade caller permissions, never expand them — so
  # any permission the called job asks for must be granted here too, or the
  # called workflow fails at startup.
  checks: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Defence-in-depth: run the full CI suite before any publish/version-PR work.
  # Branch protection already requires CI green on the PR that merged here,
  # but a bypassed merge (admin override, ruleset disabled, etc.) would otherwise
  # let a broken state publish. This makes that impossible.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: "Version or publish"
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/procon-ip
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Authenticate as the maintainer (via fine-grained PAT) rather than
          # the default GITHUB_TOKEN, so the commits and PR that
          # changesets/action makes from this checkout count as user actions
          # for the purposes of triggering downstream workflows on the
          # "Version Packages" PR. With GITHUB_TOKEN GitHub's
          # no-recursive-workflows rule would suppress CI on those PRs.
          token: ${{ secrets.CHANGESETS_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24 (LTS) ships with npm 11.x. npm Trusted Publishing requires
          # npm CLI >= 11.5.1 for the OIDC handshake; Node 22 ships with npm 10
          # which falls back to a (then-empty) NODE_AUTH_TOKEN-based auth, the
          # registry treats the request as anonymous, and we get a misleading
          # 404 on PUT. See npm/cli#9088 for the surfaced-diagnostics request.
          # CI matrix can stay on 20+22 -- this only matters for the publish step.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          # See checkout step above — same rationale. The PAT is what makes
          # the bot-opened "Version Packages" PR auto-fire CI checks.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
